<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TODO App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>TODO App</h1>

    <p id="taskCount">
      タスク 0 件
    </p>



    <!-- タスク入力 -->

    <input
      type="text"
      id="taskInput"
      placeholder="タスクを入力"
    >



    <!-- 日付 -->

    <input
      type="date"
      id="taskDate"
    >



    <!-- カテゴリ -->

    <select id="taskCategory">

      <option value="買い物">
        買い物
      </option>

      <option value="仕事">
        仕事
      </option>

      <option value="勉強">
        勉強
      </option>

      <option value="その他">
        その他
      </option>

    </select>



    <!-- 優先度 -->

    <select id="taskPriority">

      <option value="高">
        🔥 高
      </option>

      <option value="中">
        ⚡ 中
      </option>

      <option value="低">
        🌱 低
      </option>

    </select>



    <!-- 追加 -->

    <button id="addBtn">
      追加
    </button>



    <!-- 進捗 -->

    <div class="progress-area">

      <div class="progress-bg">
        <div id="progressBar"></div>
      </div>

      <p id="progressText">
        0% 完了
      </p>

    </div>



    <!-- フィルター -->

    <div class="filter-buttons">

      <button
        class="filter-btn"
        data-filter="all"
      >
        全部
      </button>

      <button
        class="filter-btn"
        data-filter="active"
      >
        未完了
      </button>

      <button
        class="filter-btn"
        data-filter="completed"
      >
        完了
      </button>

    </div>



    <!-- タスク一覧 -->

    <div id="taskList"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
