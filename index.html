<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TODO App</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div class="container">

    <h1>TODO App</h1>

    <div class="top-bar">
      <div id="taskCount" class="task-count">
        タスク 0 件
      </div>
    </div>

    <div class="icon-buttons">
      <button class="icon-btn">🏠</button>
      <button class="icon-btn">📝</button>
      <button class="icon-btn">⚙️</button>
    </div>

    <div class="input-area">

      <input
        type="text"
        id="taskInput"
        placeholder="タスクを入力">

      <select id="categorySelect">
        <option>買い物</option>
        <option>仕事</option>
        <option>勉強</option>
      </select>

      <button id="addButton">
        追加
      </button>

    </div>

    <div id="taskList"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
