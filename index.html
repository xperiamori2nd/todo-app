<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TODO App</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div class="container">

    <h1>TODO App</h1>

    <p class="count">
      タスク <span id="taskCount">0</span> 件
    </p>

    <input
      type="text"
      id="taskInput"
      placeholder="タスクを入力"
    >

    <input
      type="date"
      id="date"
    >

    <select id="category">
      <option>買い物</option>
      <option>仕事</option>
      <option>勉強</option>
      <option>その他</option>
    </select>

    <button id="addBtn">
      追加
    </button>

    <div class="filters">
      <button onclick="renderTasks('all')">全部</button>
      <button onclick="renderTasks('active')">未完了</button>
      <button onclick="renderTasks('done')">完了</button>
    </div>

    <div id="taskList"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
